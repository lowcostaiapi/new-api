name: Build deploy image (GHCR)

on:
  push:
    branches:
      - 'deploy/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          SLUG=$(printf '%s' "${GITHUB_REF_NAME#deploy/}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')
          SHORT=$(git rev-parse --short HEAD)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "version=${SLUG}-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Write VERSION
        run: echo "${{ steps.tag.outputs.version }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tarball
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
          docker save ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }} | gzip > new-api-${{ steps.tag.outputs.version }}.tar.gz
          ls -lh new-api-${{ steps.tag.outputs.version }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-${{ steps.tag.outputs.version }}
          path: new-api-${{ steps.tag.outputs.version }}.tar.gz
          retention-days: 3
