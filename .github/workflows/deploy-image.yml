name: Build deploy image (GHCR)

on:
  push:
    branches:
      - 'deploy/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write VERSION
        run: echo "${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:rc21-patched
            ghcr.io/${{ github.repository }}:rc21-patched-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image tarball
        run: |
          docker pull ghcr.io/${{ github.repository }}:rc21-patched
          docker save ghcr.io/${{ github.repository }}:rc21-patched | gzip > new-api-rc21-patched.tar.gz
          ls -lh new-api-rc21-patched.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-rc21-patched
          path: new-api-rc21-patched.tar.gz
          retention-days: 3
